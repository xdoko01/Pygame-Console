[project]
name = "pgconsole"
version = "0.1.4"
description = "A Python library to add full-featured console to any game."
authors = [
    { name = "xdoko01" }
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pygame-ce",
    "pgbitmapfont>=0.1.7"
]

[project.urls]
Homepage = "https://github.com/xdoko01/Pygame-Console"
Issues = "https://github.com/xdoko01/Pygame-Console/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"